# About section: the paragraphs on the left and the facts list on the right.
paragraphs:
- I'm from Kenema District in eastern Sierra Leone. I started as a volunteer laboratory technician at Kenema Government Hospital and spent the next fifteen years there, most of them in the national reference laboratory for Lassa fever and Ebola, where I became Deputy Director.
- Before the doctorate, I co-developed and field-validated rapid tests for Ebola and Lassa fever, helped sequence both viruses with the Broad Institute and ACEGID, co-chaired CEPI's laboratory working group across five West African countries, and taught medical laboratory science at Eastern Technical University for thirteen years.
- I want to keep doing work that connects the bench to the decisions health systems make during outbreaks, in diagnostics, vaccine immunology, or laboratory systems, whether in industry, a global health program, or a research institution.
