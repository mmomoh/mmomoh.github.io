# Profile and contact details shown in the hero and the contact section.
hero_line: Biomedical scientist working on diagnostics, genomic epidemiology, and immunology for Ebola, Lassa fever and other emerging infectious diseases.
hero_text: I spent fifteen years in Sierra Leone's national Lassa and Ebola laboratory in Kenema, helping build the rapid tests, other diagnostics and genomic surveillance the region relies on. At Tulane University School of Medicine, I now study what survivors' immune systems remember, and what that means for vaccines.
