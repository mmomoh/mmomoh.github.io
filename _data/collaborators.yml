# Collaborators: one row per institution. Leave paper and paper_link empty when there is no paper.
rows:
- institution: Kenema Government Hospital, Sierra Leone
  people: Augustine Goba, Donald Grant, Sheik Humarr Khan
  work: The laboratory and clinical teams of the Lassa fever program, where most of this work was done.
  paper: Gire et al., Science 2014
  paper_link: https://doi.org/10.1126/science.1259657
  note: Sheik Humarr Khan led the hospital's Lassa fever program and died of Ebola in July 2014. He and four other Kenema co-authors of our 2014 Science paper died before it was published.
