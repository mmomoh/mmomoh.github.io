entries:
- date: October 2026
  title: 'New preprint: how Ebola reached healthcare workers at Kenema'
  text: 'Seventy-nine healthcare workers at Kenema Government Hospital were infected with Ebola in 2014. We went back to the genomes from that outbreak to ask how the virus reached the people treating patients. The preprint combines genomic analysis of 279 viruses from Kenema District with firsthand accounts from colleagues who were on those wards, and shows Ebola spreading between clinical, laboratory and pharmacy staff. I co-led it with Christopher Shin, with the Broad Institute of MIT and Harvard, Tulane University, Scripps Research and the Liverpool School of Tropical Medicine. Preprint, not yet peer reviewed.'
  link: https://www.medrxiv.org/content/10.64898/2026.10.26.26366557v1
  link_text: Read the preprint on medRxiv
  image: ''
